disable-version-check: false
log-level: info
report:
    fail-on-severity: critical,high,medium,low
    format: ""
    include-stats: false
    no-color: false
    no-extract: false
    no-rule-meta: false
    output: ""
    report: security
    severity: critical,high,medium,low,warning
rule:
    disable-default-rules: false
    only-rule: []
    skip-rule: []
scan:
    context: ""
    data_subject_mapping: ""
    disable-domain-resolution: true
    domain-resolution-timeout: 3s
    # -1 = 本地掃描不因發現問題而 crash terminal，方便查閱報告。
    # CI 透過 .github/workflows/bearer.yml 的 exit-code: "1" 覆蓋此值以阻擋 PR。
    exit-code: -1
    external-rule-dir: []
    force: false
    hide_progress_bar: false
    internal-domains: []
    parallel: 0
    quiet: false
    scanner:
        - sast
    skip-git-ignore: false
    # tools/agent-scan 是本機 CLI（不部署），讀取「操作者指定的路徑」是預期行為，
    # 會被 SAST 的路徑穿越規則誤判；網站程式碼（app/、server/）仍完整掃描
    skip-path:
        - tools/agent-scan
    skip-test: true
