name: Argos CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  id-token: write # Required for Argos CI GitHub OIDC authentication

# 單純以來源分支去重即可。是否要跑由 decide job 依「PR 當下完整狀態」判斷，
# 與觸發事件無關，故多 label 同時掛上也不會有順序問題。
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # 混合式 gate：push / UI 檔變動 / run-argos-ci label 任一成立才跑 Argos
  decide:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # diff 需要 base/head 歷史
      - id: gate
        run: |
          # push 到 dev/main，或 PR 帶 run-argos-ci label → 直接跑
          if [ "${{ github.event_name }}" = "push" ] \
             || [ "${{ contains(github.event.pull_request.labels.*.name, 'run-argos-ci') }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 否則看是否有 UI 相關檔案變動
          changed=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")
          if echo "$changed" | grep -qE \
             '^(app/|content/|public/|tests/)|\.(vue|css)$|^(content|nuxt|tailwind|playwright)\.config\.ts$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  argos:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start dev server
        run: pnpm dev &

      - name: Wait for server to be ready
        run: timeout 60 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 2; done'

      - name: Run Playwright tests
        run: pnpm exec playwright test
