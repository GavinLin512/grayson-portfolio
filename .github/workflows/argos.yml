name: Argos CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  id-token: write # Required for Argos CI GitHub OIDC authentication

# 同一條來源分支（含同一 commit 同時掛在 dev/main 兩個 PR 的情況）只保留最新一個 run，
# 解決同秒重複觸發。head_ref 在 PR 事件為來源分支名；push 事件為空時 fallback 到 ref。
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  argos:
    # push 到 dev/main 一律跑（更新 baseline）；PR 只有帶 run-argos-ci label 才跑
    if: >-
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'run-argos-ci')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start dev server
        run: pnpm dev &

      - name: Wait for server to be ready
        run: timeout 60 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 2; done'

      - name: Run Playwright tests
        run: pnpm exec playwright test
