name: Argos CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled]

# 預設不給任何權限，每個 job 只開自己需要的（最小權限原則）
permissions: {}

# 單純以來源分支去重即可。是否要跑由 decide job 依「PR 當下完整狀態」判斷，
# 與觸發事件無關，故多 label 同時掛上也不會有順序問題。
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # 混合式 gate：push / UI 檔變動 / run-argos-ci label 任一成立才跑 Argos
  decide:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # diff 需要 base/head 歷史
          persist-credentials: false # 不把 GITHUB_TOKEN 留在 .git/config
      - id: gate
        # ${{ }} 一律先放進 env，script 內只用 shell 變數，避免 template injection
        env:
          EVENT_NAME: ${{ github.event_name }}
          HAS_RUN_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'run-argos-ci') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # push 到 dev/main，或 PR 帶 run-argos-ci label → 直接跑
          if [ "$EVENT_NAME" = "push" ] || [ "$HAS_RUN_LABEL" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 否則看是否有 UI 相關檔案變動
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          if echo "$changed" | grep -qE \
             '^(app/|content/|public/|tests/)|\.(vue|css)$|^(content|nuxt|tailwind|playwright)\.config\.ts$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  argos:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Argos 用 GitHub OIDC 驗證，只有這個 job 需要
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # --frozen-lockfile：lockfile 與 package.json 不一致就失敗，不偷偷解析新版本
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start dev server
        run: pnpm dev &

      - name: Wait for server to be ready
        run: timeout 60 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 2; done'

      - name: Run Playwright tests
        run: pnpm exec playwright test
