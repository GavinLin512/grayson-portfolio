name: Argos CI

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  id-token: write # Required for Argos CI GitHub OIDC authentication

jobs:
  argos:
    if: contains(github.event.pull_request.labels.*.name, 'run-argos-ci')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start dev server
        run: pnpm dev &

      - name: Wait for server to be ready
        run: timeout 60 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 2; done'

      - name: Run Playwright tests
        run: pnpm exec playwright test
